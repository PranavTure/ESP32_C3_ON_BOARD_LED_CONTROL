<!DOCTYPE html>
<html>
<head>
    <title>ESP32 LED Control</title>
</head>

<body>

<h2>ESP32 LED Control</h2>

<input id="ip" placeholder="ESP32 IP address">

<br><br>

<button onclick="ledOn()">ON</button>
<button onclick="ledOff()">OFF</button>

<p id="status">Status: --</p>

<script>

function getIP()
{
    return document.getElementById("ip").value.trim();
}

function ledOn()
{
    fetch("http://" + getIP() + "/led/on")
        .then(response => response.text())
        .then(data => {
            document.getElementById("status").innerText = data;
        })
        .catch(error => {
            document.getElementById("status").innerText = "Connection failed";
        });
}

function ledOff()
{
    fetch("http://" + getIP() + "/led/off")
        .then(response => response.text())
        .then(data => {
            document.getElementById("status").innerText = data;
        })
        .catch(error => {
            document.getElementById("status").innerText = "Connection failed";
        });
}

</script>

</body>
</html>
